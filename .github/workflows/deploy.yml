name: Publish to webhotel

on:
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_SSH_USER }}
      DEPLOY_TARGET: ${{ secrets.DEPLOY_TARGET_PATH }}
      DEPLOY_PASSWORD: ${{ secrets.DEPLOY_SSH_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Publish site files
        shell: bash
        run: |
          if [[ -n "$DEPLOY_PASSWORD" ]]; then
            sudo apt-get update --quiet
            sudo apt-get install --yes --quiet sshpass
            export SSHPASS="$DEPLOY_PASSWORD"
            transport='sshpass -e ssh -o IdentitiesOnly=yes'
          else
            transport='ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes'
          fi

          rsync -az --delete-after \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.gitignore' \
            --exclude 'README.md' \
            --exclude '.well-known/' \
            --exclude 'cgi-bin/' \
            -e "$transport" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_TARGET/"
